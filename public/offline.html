<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #F9FAFB; color: #1F2937;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .caixa { max-width: 340px; }
    .simbolo {
      width: 64px; height: 64px; margin: 0 auto 20px;
      border-radius: 16px; background: #F3F4F6;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    h1 { font-size: 19px; margin-bottom: 10px; color: #111827; }
    p { font-size: 14px; line-height: 1.6; color: #6B7280; margin-bottom: 22px; }
    button {
      background: #2563EB; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: .85; }
    .nota { font-size: 12px; color: #9CA3AF; margin-top: 22px; }
  </style>
</head>
<body>
  <div class="caixa">
    <div class="simbolo">&#128246;</div>
    <h1>Sem ligação à internet</h1>
    <p>
      Esta aplicação vai buscar as contas à nuvem de cada vez que a abre, por isso
      precisa de rede para funcionar. Ligue os dados móveis ou o wi-fi e tente de novo.
    </p>
    <button onclick="location.reload()">Tentar outra vez</button>
    <p class="nota">
      Nada se perdeu. A informação está toda guardada e aparece assim que houver ligação.
    </p>
  </div>
</body>
</html>
